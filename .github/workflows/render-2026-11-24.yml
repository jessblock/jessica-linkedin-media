name: Render November 24 editorial artwork
on:
  push:
    paths:
      - 'posts/2026-11-24-conservacao/cover.svg'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cairosvg pillow
      - name: Render original outline artwork to PNG
        run: |
          python - <<'PY'
          import cairosvg
          from PIL import Image
          path = 'posts/2026-11-24-conservacao/cover'
          cairosvg.svg2png(url=path+'.svg',write_to=path+'.png',output_width=1080,output_height=1350)
          with Image.open(path+'.png') as image:
              assert image.size == (1080,1350) and image.format == 'PNG'
          print('RENDERED',path+'.png', '1080x1350')
          PY
      - name: Commit generated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/2026-11-24-conservacao/cover.png
          git diff --cached --quiet || (git commit -m "Render November 24 original artwork" && git push)
