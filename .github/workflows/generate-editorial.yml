name: Generate first editorial LinkedIn carousel
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow reportlab
      - run: python scripts/generate_editorial.py
      - name: Commit generated media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/produto-problema-cliente/
          git diff --cached --quiet || (git commit -m "Generate editorial LinkedIn carousel" && git push)
