name: Convert approved PDF into four LinkedIn images
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pymupdf pillow
      - run: python scripts/convert_approved_to_images.py
      - name: Commit four approved images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/post-01/slide-*.jpg
          git diff --cached --quiet || (git commit -m "Export approved carousel as four JPEG slides" && git push)
