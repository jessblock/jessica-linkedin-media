name: Generate public test PDF and cover
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF and image libraries
        run: python -m pip install reportlab pillow
      - name: Generate public test assets
        run: python scripts/generate_test_assets.py
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/technical-test/carousel.pdf posts/technical-test/cover.jpg
          git diff --cached --quiet || (git commit -m "Generate public technical test media" && git push)
